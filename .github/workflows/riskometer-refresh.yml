name: Refresh riskometer data

# Risk levels are disclosed within 10 days after month-end; run on the 12th and 20th as a retry.
on:
  schedule:
    - cron: "30 3 12 * *"
    - cron: "30 3 20 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: riskometer-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install PDF text tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Fetch, validate and merge official disclosures
        run: node scripts/riskometer/refresh.mjs
      - name: Commit if changed and trigger the existing Pages deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/lib/fund-data/riskometer-data.ts; then
            echo "No riskometer changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/fund-data/riskometer-data.ts
          git commit -m "Update riskometer data from official disclosures"
          git push
          # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the existing deploy explicitly.
          gh workflow run main.yml --ref "${GITHUB_REF_NAME}"
